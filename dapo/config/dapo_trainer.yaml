hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}

reward:
  reward_manager:
    name: dapo
  reward_kwargs:
    overlong_buffer_cfg:
      enable: True        # Soft Overlong Punishment (DAPO paper Sec 3.4)
      len: 4096           # Lcache: soft penalty buffer window (tokens)
      penalty_factor: 1.0 # Linear penalty slope
      log: True
    max_resp_len: 16384   # Lmax: expected max response length (tokens)

algorithm:
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit

trainer:
  project_name: verl-dapo
